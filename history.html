<!DOCTYPE html>
<html>
<head>
    <title>Order History</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f7f9;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #1b5e20;
        }

        .order-info {
            background: #e8f5e9;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .timeline {
            border-left: 4px solid #1b5e20;
            padding-left: 20px;
        }

        .item {
            margin-bottom: 25px;
            position: relative;
        }

        .item:before {
            content: "";
            width: 14px;
            height: 14px;
            background: #1b5e20;
            border-radius: 50%;
            position: absolute;
            left: -29px;
            top: 5px;
        }

        .status {
            font-weight: bold;
            font-size: 18px;
        }

        .date {
            color: gray;
            font-size: 14px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            background: #1b5e20;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
        }

    </style>

</head>

<body>


<div class="container">


<h1>Order Tracking</h1>


<div class="order-info">

<p>
<strong>Order Number:</strong>
{{ order.order_no }}
</p>

<p>
<strong>Service:</strong>
{{ order.service }}
</p>

<p>
<strong>Current Status:</strong>
{{ order.status }}
</p>

</div>



<h2>Status Timeline</h2>


<div class="timeline">


{% for item in history %}

<div class="item">

<div class="status">
{{ item.status }}
</div>

<div class="date">
{{ item.changed_at }}
</div>


</div>


{% else %}

<p>No history available yet.</p>

{% endfor %}


</div>


<a href="{{ url_for('customer_dashboard') }}">
Back to Dashboard
</a>


</div>


</body>
</html>
